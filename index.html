<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恆的学习站</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--acc:#2f5d8a}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--mute:#9a988f;--line:#33322e;--acc:#7fa8d1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 32px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
a.card,div.card{display:block;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
.card b{display:block;font-size:18px;margin-bottom:4px}
.card span{color:var(--mute);font-size:14px}
div.card{opacity:.55}
</style>
</head>
<body>
<main>
<h1>恆的学习站</h1>
<p class="sub">个人主页还在建，先放各科的知识网页。</p>
<div class="grid">
  <a class="card" href="gaoshu/"><b>高等数学</b><span>同济第八版上册 · 知识框架、题型卡、易错点、间隔复习</span></a>
  <a class="card" href="xiandai/"><b>线性代数</b><span>学校教材《线性代数》 · 知识框架、题型卡、易错点、间隔复习</span></a>
  <a class="card" href="cyuyan/"><b>C语言</b><span>《新编C语言程序设计》第2版 · 知识框架、例题代码、易错点、间隔复习</span></a>
</div>
</main>
</body>
</html>
