<html lang="zh-CN">
<meta charset="utf-8">

<title>高数知识网页</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
类型: 项目
标题: 高等数学知识网页（页面框架）
写入者: 高等数学科目项目
创建日期: 2026-10-19
更新日期: 2026-10-19
状态: 进行中
用法见同文件夹「说明.md」。框架只写一次；加小节 = 在「数据/」放一个数据文件 + 在下面 DATA_FILES 加一行。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="依赖/katex内嵌.css">
<style>
/* 布局：左侧目录（章 → 节 → 章末），右侧一节一页：关系图 → 知识点 / 题型梳理 / 易错点；另有「复习」页按间隔安排的混合抽查 */
:root {
  --paper: #f5f7f9; --sheet: #ffffff; --ink: #18212b; --muted: #5a6775; --line: #d9e0e7; --edge: #9aa8b6;
  --grid: rgba(29, 95, 166, 0.055);
  --accent: #1d5fa6; --accent-soft: #e5edf7;
  --k-map: #4a5d78; --k-map-soft: #e9edf3;
  --yan: #6c43a6; --yan-soft: #efe8f8;
  --hl-k-bg: #fde9a6; --hl-k: #4a3500; --hl-a: #1a56b0; --hl-w: #b32d2d; --hl-w-bg: #fbe3e3;
  --warn: #b0561a; --warn-soft: #fbeee3;
  --ok: #2b7649; --ok-soft: #e3f2e9; --mid: #94680d; --mid-soft: #f7efda; --bad: #ae3838; --bad-soft: #f8e5e5;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1419; --sheet: #161d24; --ink: #e2e8ee; --muted: #96a3b0; --line: #29333d; --edge: #52606e;
    --grid: rgba(120, 174, 240, 0.05);
    --accent: #7db0ef; --accent-soft: #1a2a3c; --k-map: #a9b8cc; --k-map-soft: #1d2530;
    --yan: #b893ef; --yan-soft: #281f3c;
    --hl-k-bg: #54420f; --hl-k: #ffe9a8; --hl-a: #8dbcff; --hl-w: #ff9d9d; --hl-w-bg: #3e1f1f;
    --warn: #ee9f5f; --warn-soft: #33231a; --ok: #6fcb95; --ok-soft: #16301f;
    --mid: #e3bd62; --mid-soft: #30281a; --bad: #ef8b8b; --bad-soft: #381d1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1419; --sheet: #161d24; --ink: #e2e8ee; --muted: #96a3b0; --line: #29333d; --edge: #52606e;
  --grid: rgba(120, 174, 240, 0.05);
  --accent: #7db0ef; --accent-soft: #1a2a3c; --k-map: #a9b8cc; --k-map-soft: #1d2530;
  --yan: #b893ef; --yan-soft: #281f3c;
  --hl-k-bg: #54420f; --hl-k: #ffe9a8; --hl-a: #8dbcff; --hl-w: #ff9d9d; --hl-w-bg: #3e1f1f;
  --warn: #ee9f5f; --warn-soft: #33231a; --ok: #6fcb95; --ok-soft: #16301f;
  --mid: #e3bd62; --mid-soft: #30281a; --bad: #ef8b8b; --bad-soft: #381d1d;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--paper); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font: 15px/1.75 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.katex { font-size: 1.04em; }
.katex-display { margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; padding-block: 2px; }

/* 顶栏 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; align-items: center; gap: 12px; height: 54px; max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand b { font: 700 18px/1 var(--f-display); white-space: nowrap; }
.brand span { font: 12px/1 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r);
  padding: 5px 12px; font-size: 13px; line-height: 1.5; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { color: var(--sheet); filter: brightness(1.08); }
.dot { font: 500 11px/18px var(--f-mono); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: var(--sheet); text-align: center; }
#tocBtn { display: none; }

/* 主体 */
.shell {
  display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav#toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.toc-head { display: none; }
#tocMask { display: none; }
.toc-ch { border-bottom: 1px solid var(--line); padding-block: 6px; }
.toc-ch summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-weight: 500; }
.toc-ch summary::-webkit-details-marker { display: none; }
.toc-ch summary .no { font: 12px var(--f-mono); color: var(--muted); width: 4.2em; flex: none; white-space: nowrap; }
.toc-ch summary .cnt { margin-left: auto; font: 11px var(--f-mono); color: var(--muted); }
.toc-list { list-style: none; margin: 2px 0 6px; padding: 0; display: grid; gap: 1px; }
.toc-list a, .toc-list span {
  display: flex; gap: 8px; padding: 3px 8px; border-radius: 4px; font-size: 13.5px; line-height: 1.55; text-decoration: none; color: var(--ink);
}
.toc-list .sn { font: 12px/1.9 var(--f-mono); color: var(--muted); flex: none; width: 3em; }
.toc-list a:hover { background: var(--accent-soft); }
.toc-list a.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.toc-list a.on .sn { color: var(--accent); }
.toc-list span { color: var(--muted); opacity: 0.6; }
.toc-list .toc-out { margin: 2px 0 6px 12px; padding-left: 10px; border-left: 1px solid var(--line); }
.toc-out > summary, .out-g > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 3px 4px; border-radius: 4px; }
.toc-out > summary::-webkit-details-marker, .out-g > summary::-webkit-details-marker { display: none; }
.toc-out > summary::before, .out-g > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.toc-out[open] > summary::before, .out-g[open] > summary::before { transform: rotate(90deg); }
.toc-out > summary:hover, .out-g > summary:hover { background: var(--accent-soft); }
.toc-out > summary { font-weight: 600; color: var(--ink); }
.out-g .cnt { margin-left: auto; font: 11px var(--f-mono); }
.out-g { margin-left: 4px; }
.toc-list .toc-out a { display: block; font-size: 12.5px; padding: 2px 8px; line-height: 1.5; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toc-list .toc-out a:hover { color: var(--accent); }
.out-sub { font-size: 11.5px; color: var(--muted); opacity: .75; padding: 4px 8px 0; }
.toc-list .end a, .toc-list .end span { margin-top: 4px; border-top: 1px dashed var(--line); border-radius: 0; padding-top: 6px; }
.toc-list .end .sn { color: var(--yan); }

main { min-width: 0; }
.eyebrow { font: 500 12px/1.4 var(--f-mono); color: var(--muted); letter-spacing: 0.04em; }
h1 { font: 700 clamp(26px, 4vw, 34px)/1.25 var(--f-display); margin: 6px 0 10px; text-wrap: balance; }
h2 { font: 700 20px/1.35 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font: 700 16px/1.4 var(--f-display); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta .pg { font-family: var(--f-mono); color: var(--accent); }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.note { font-size: 12.5px; color: var(--muted); }
.sub { font-size: 13px; font-weight: 700; color: var(--muted); margin: 10px 0 2px; letter-spacing: 0.04em; }

/* 遮住自测（通用） */
.cover-on .ci:not(.show) .cov { filter: blur(7px); opacity: .55; user-select: none; }
.cover-on .ci:not(.show) .cov * { pointer-events: none; }
.cover-on .ci:not(.show) { cursor: pointer; }
.cov { transition: filter .2s, opacity .2s; }
.cover-on .tcard:not(:has(.ci.show)) .nm-tail { filter: blur(6px); opacity: .55; user-select: none; }
.reveal-hint { display: none; font-size: 12px; color: var(--accent); font-weight: 400; }
.cover-on .ci:not(.show) .reveal-hint { display: inline; }

/* 知识框架：关系图 */
.frame { margin: 20px 0 24px; padding: 16px 20px 18px; }
.frame-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.mainline { margin: 8px 0 12px; max-width: 60em; }
.cmap-wrap { overflow-x: auto; padding-bottom: 6px; }
.cmap { position: relative; margin: 4px 0; }
.cmap svg { position: absolute; inset: 0; overflow: visible; }
.elabel { position: absolute; z-index: 3; transform: translate(-50%, -50%); max-width: 112px; padding: 1px 6px; border-radius: 4px; background: var(--sheet); font-size: 12px; line-height: 1.45; color: var(--muted); text-align: center; }
.keys { margin-top: 14px; }
.keys ol { margin: 4px 0 0; padding-left: 1.4em; display: grid; gap: 4px; }
.keys li::marker { font: 500 12px var(--f-mono); color: var(--accent); }
.cmap line { stroke: var(--edge); stroke-width: 1.5; }
.cnode { position: absolute; width: 180px; padding: 7px 12px 8px; border-radius: var(--r); border: 1.5px solid var(--k-map); background: var(--k-map-soft); line-height: 1.4; z-index: 2; }
.cnode b { display: block; font: 700 15px/1.35 var(--f-display); }
.cnode small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.cnode.k-func { border-color: var(--accent); background: var(--accent-soft); }
.cnode.k-prop { border-color: var(--ok); background: var(--ok-soft); }
.cnode.k-build { border-color: var(--mid); background: var(--mid-soft); }
.cnode.go { cursor: pointer; transition: box-shadow .15s, transform .15s; }
.cnode.go:hover, .cnode.go:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft), 0 2px 8px rgba(0,0,0,.08); transform: translateY(-1px); outline: none; }
.cnode.go::after { content: "↗"; position: absolute; right: 7px; top: 4px; font-size: 11px; color: var(--muted); }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); background-color: var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.go-tip { font-size: 12.5px; color: var(--muted); margin: -4px 0 8px; }
/* 全章思维导图 */
.mm-wrap { overflow-x: auto; padding: 6px 2px 12px; }
.mm-node { display: flex; align-items: center; }
.mm-kids { display: flex; flex-direction: column; padding-left: 30px; position: relative; }
.mm-kids::before { content: ""; position: absolute; left: 0; top: 50%; width: 15px; border-top: 1.5px solid var(--edge); }
.mm-kids > .mm-node { position: relative; padding: 3px 0; }
.mm-kids > .mm-node::before { content: ""; position: absolute; left: -15px; top: 50%; width: 15px; border-top: 1.5px solid var(--edge); }
.mm-kids > .mm-node::after { content: ""; position: absolute; left: -15px; top: 0; bottom: 0; border-left: 1.5px solid var(--edge); }
.mm-kids > .mm-node:first-child::after { top: 50%; }
.mm-kids > .mm-node:last-child::after { bottom: 50%; }
.mm-kids > .mm-node:only-child::after { display: none; }
.mm-chip { display: inline-block; padding: 3px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--sheet); font-size: 13px; line-height: 1.45; white-space: nowrap; }
.lv0 > .mm-chip { font: 700 16px/1.4 var(--f-display); border-color: var(--accent); background: var(--accent-soft); padding: 8px 14px; }
.lv1 > .mm-chip { font: 700 15px/1.4 var(--f-display); border-color: var(--k-map); background: var(--k-map-soft); }
.lv2 > .mm-chip { font-weight: 600; border-color: var(--accent); }
.mm-chip.go { cursor: pointer; }
/* 根节点在上，四个分支竖排；每个分支内部横向展开 */
.lv0 { flex-direction: column; align-items: flex-start; }
.lv0 > .mm-kids { margin-left: 22px; padding-left: 30px; padding-top: 4px; }
.lv0 > .mm-kids::before { display: none; }
.lv0 > .mm-kids > .mm-node { padding: 8px 0; }
.lv0 > .mm-kids > .mm-node::after, .lv0 > .mm-kids > .mm-node:first-child::after { left: -30px; top: 0; }
.lv0 > .mm-kids > .mm-node::before { left: -30px; width: 30px; }
.lv0 > .mm-kids > .mm-node:only-child::after { display: block; bottom: 50%; }
@media (max-width: 640px) {
  .mm-node { flex-direction: column; align-items: flex-start; }
  .mm-kids, .lv0 > .mm-kids { margin-left: 12px; padding-left: 20px; padding-top: 2px; }
  .mm-kids::before { display: none; }
  .mm-kids > .mm-node, .lv0 > .mm-kids > .mm-node { padding: 3px 0; }
  .mm-kids > .mm-node::before, .lv0 > .mm-kids > .mm-node::before { left: -20px; width: 18px; top: 16px; }
  .mm-kids > .mm-node::after, .mm-kids > .mm-node:first-child::after,
  .lv0 > .mm-kids > .mm-node::after, .lv0 > .mm-kids > .mm-node:first-child::after { left: -20px; top: 0; bottom: 0; height: auto; }
  .mm-kids > .mm-node:last-child::after, .lv0 > .mm-kids > .mm-node:last-child::after { bottom: auto; height: 16px; }
  .mm-kids > .mm-node:only-child::after { display: block; bottom: auto; height: 16px; }
  .mm-chip { white-space: normal; }
}
.mm-chip.go:hover, .mm-chip.go:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
/* 混合自测 */
.mx { padding: 14px 18px; margin-bottom: 12px; }
.mx-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; }
.mx-blk { font-size: 12px; color: var(--muted); }
.mx-q { margin: 2px 0 8px; }
.mx-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.mx-box { margin-top: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.mx-box b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.badge-b { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* 切换栏 */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; color: var(--muted); font-weight: 500; }
.tab .n { font: 12px var(--f-mono); margin-left: 4px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 16px; font-size: 13.5px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { width: 34px; height: 20px; appearance: none; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--sheet); transition: left .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tally { font: 12.5px var(--f-mono); color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

/* 知识点 */
.group { margin-bottom: 26px; }
.group > h3 { padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.pt { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.pt:last-child { border-bottom: 0; }
.pt-side { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
.kind { font: 700 13px var(--f-display); color: var(--accent); }
.kind.k-定理, .kind.k-结论 { color: var(--ok); }
.kind.k-公式 { color: var(--mid); }
.pg-mono { font: 11.5px/1.4 var(--f-mono); color: var(--muted); }
.pt-name { font-weight: 700; margin-bottom: 2px; }
.pt-body p { margin: 0; }
.pt > div { min-width: 0; overflow-x: auto; }
.pt-notes { margin: 6px 0 0; padding-left: 1.1em; font-size: 14px; }
.pt-notes li { margin: 3px 0; }
.pt-notes li::marker { color: var(--accent); }
.cue-line { display: none; margin: 2px 0 4px; padding: 5px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r) var(--r) 0; font-size: 14px; color: var(--ink); }
.cover-on .ci:not(.show) .cue-line { display: block; }
.cue-line b { color: var(--accent); font-weight: 600; margin-right: 6px; }
.cue-q { display: none; font-size: 13.5px; color: var(--accent); font-weight: 600; margin-right: 6px; }
.cover-on .ci:not(.show) .cue-q { display: inline; }
.pt-notes li .cov.cov-block { display: inline; }
.cue-n { display: none; font-size: 12px; color: var(--muted); font-weight: 400; }
.cover-on .ci:not(.show) .cue-n { display: inline; }
.cue { color: var(--ink); }
.cover-on .ci:not(.show) .cue { font-weight: 600; }
.quiz { margin-top: 8px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; }
.quiz b { color: var(--accent); font-weight: 500; flex: none; }

/* 题型卡 */
.cards { display: grid; gap: 16px; }
.tcard { padding: 0; overflow: hidden; }
.tc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.tc-no { font: 500 12px var(--f-mono); color: var(--muted); }
.tc-name { font: 700 16.5px/1.4 var(--f-display); }
.badge-t { font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 4px; line-height: 20px; }
.badge-t.yan { background: var(--yan-soft); color: var(--yan); }
.status { margin-left: auto; font: 500 12px var(--f-mono); padding: 1px 8px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.status.s-learned { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.status.s-ok { color: var(--ok); }
.status.s-mid { color: var(--mid); }
.status.s-bad { color: var(--bad); }
.tc-body { padding: 12px 18px 4px; display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 10px; }
.row > .lab { font-size: 12.5px; font-weight: 700; color: var(--muted); padding-top: 3px; letter-spacing: 0.06em; }
.row > div { min-width: 0; }

/* 线索自测：每条只露出开头一小段（到第一个，：；。为止，不拆开公式和加粗），其余遮住 */

    if ("，,：:；;。".includes(c) && i >= 3) return i + 1 > 34 ? fallbackCue(raw) : [raw.slice(0, i + 1), raw.slice(i + 1)];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const due = shuffle(pool.filter(it => store.srs[it.key] && store.srs[it.key].due <= t));
  const fresh = shuffle(pool.filter(it => !store.srs[it.key]));
  const pick = shuffle(due.concat(fresh).slice(0, opt.size));
  if (!pick.length) { $("#main").insertAdjacentHTML("beforeend", `<p class="msg">这个范围里今天没有要复习的条目。</p>`); return; }

}

let sIdx = null;
function plain(s) { return String(s || "").replace(/\$+/g, " ").replace(/\\[a-zA-Z]+/g, " ").replace(/[{}^_]/g, "").replace(/\*\*/g, "").replace(/==|\+\+|!!/g, ""); }
function buildIndex() {
  if (sIdx) return sIdx;
  sIdx = allItems(true).map(it => {
    const o = it.obj; let f = [];
    if (it.kind === "pt") f = [o.name, o.body, ...(o.notes || []), o.quiz, o.kind];
    else if (it.kind === "rel") f = [o.q, o.a];
    else if (it.kind === "type") f = [o.name, o.signal, o.example.q, o.example.src, o.idea && o.idea.key, ...((o.idea && o.idea.how) || []), ...(((o.idea && o.idea.refs) || []).map(r => r.src + " " + r.text)), o.think, o.first, ...o.steps, o.pitfall, o.practice];
    else if (it.kind === "pit") f = [o.wrong, o.test, o.ans, o.why, o.right, o.link];
    else f = [o.q, o.hint, o.ans, o.src];
    f.push(noteOf(it.key));
    const raw = plain(f.filter(Boolean).join("　"));
    return { it, title: plain(itemTitle(it)), raw, low: raw.toLowerCase() };
  });
  return sIdx;
}
function renderSearch(q) {
  curSec = null;
  $("#main").innerHTML = `<div class="eyebrow">全站搜索</div><h1>搜索</h1>
    <input class="srbox" id="qIn" type="search" placeholder="搜题型名、知识点、关键词，空格分隔多个词" autocomplete="off">
    <p class="note" id="srCount" style="margin:8px 0 12px"></p><div id="srOut"></div>`;
  const inp = $("#qIn"); inp.value = q || "";
  let tm = null;
  const go = () => { runSearch(inp.value); history.replaceState(null, "", "#search:" + encodeURIComponent(inp.value)); };
  inp.addEventListener("input", () => { clearTimeout(tm); tm = setTimeout(go, 150); });
  runSearch(inp.value); if (!q) inp.focus();
}
function runSearch(q) {
  const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out = $("#srOut"), cnt = $("#srCount");
  if (!toks.length) { out.innerHTML = ""; cnt.textContent = "输入关键词开始搜索。"; return; }
  const hits = [];
  for (const e of buildIndex()) {
    if (!toks.every(t => e.low.includes(t))) continue;
    const tl = e.title.toLowerCase();
    hits.push({ e, score: toks.reduce((a, t) => a + (tl.includes(t) ? 3 : 0), 0) });
  }
  hits.sort((a, b) => b.score - a.score || secRank(a.e.it.sec) - secRank(b.e.it.sec));
  cnt.textContent = hits.length ? `${hits.length} 条结果` + (hits.length > 60 ? "，只显示前 60 条" : "") : "没有找到。换个词试试。";
  const re = new RegExp("(" + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  out.innerHTML = hits.slice(0, 60).map(({ e }) => {
    const it = e.it, i = e.low.indexOf(toks[0]);
    const snip = e.raw.slice(Math.max(0, i - 24), Math.max(0, i - 24) + 90);
    const tg = itemTarget(it);
    return `<a class="sr panel" href="#${it.sec.id}${tg ? ":" + tg : ""}"><div class="wk-top"><span class="rv-kind k-${it.kind}">${KIND_NAME[it.kind]}</span><span class="src">${esc(secLabel(it.sec))}</span></div><div class="t">${esc(e.title).replace(re, "<mark>$1</mark>")}</div><div class="snip">${esc(snip).replace(re, "<mark>$1</mark>")}</div></a>`;
  }).join("");
}

/* 错题索引：错题 ↔ 知识点和题型。data.links 写 ["1.5/p7","1.6/t11"]（p 知识点、t 题型、e 易错点、m 混合题）；没写 links 就用 type_key */
function wrongLinks(w) { const l = w.data && Array.isArray(w.data.links) ? w.data.links : (w.type_key ? [w.type_key] : []); return l.filter(Boolean); }
function plainLbl(t) { return String(t || "").replace(/\$+/g, "").replace(/\\([a-zA-Z]+)/g, "$1").replace(/[{}^_]/g, "").replace(/\*\*/g, "").replace(/==|\+\+|!!/g, "").replace(/\s+/g, " ").trim(); }
function keyInfo(key) {
  const i = key.indexOf("/"), sid = key.slice(0, i), t = key.slice(i + 1), d = secById(sid);
  if (!d || !t) return d ? { href: "#" + sid, label: secLabel(d) } : null;
  let kind = "", name = "";
  if (t[0] === "p") { kind = "知识点"; for (const g of d.points || []) for (const p of g.items) if (p.id === t) name = p.name; }
  else if (t[0] === "t") { kind = "题型"; const x = (d.types || []).find(x => x.id === t); name = x ? x.name : ""; }
  else if (t[0] === "e") { kind = "易错点"; const x = (d.pitfalls || [])[+t.slice(1) - 1]; name = x ? x.wrong : ""; }
  else if (t[0] === "m") { kind = "混合题"; const x = (d.mixed || []).find(x => x.id === t); name = x ? (x.src || x.q) : ""; }
  if (!name) return null;

  const key = "w/" + w.id, d = w.data || {};
  const infos = wrongLinks(w).map(keyInfo).filter(Boolean);
  const link = infos.length ? `<div class="wr-links"><span class="lab">对应知识点和题型 →</span>${infos.map(x => `<a class="chip" href="${esc(x.href)}">${esc(x.label)}</a>`).join("")}</div>` : "";
  return `<article class="wr panel" id="w${w.id}"><div class="wk-top"><span class="rv-kind k-wr">错题 ${w.id}</span>${w.teacher ? `<span class="wr-teach" title="老师补充题">师</span>` : ""}<span class="src">${esc(w.source || "")}</span>${(() => { const r = weekMark(w.id); return `<span class="wr-wk ${r}">${r === "ok" ? "本周已重做 ✓" : r === "bad" ? "本周已重做 ✗" : "本周未重做"}</span>`; })()}${w.cause ? `<span class="wr-cause">${esc(w.cause)}</span>` : ""}<span class="src">${esc((w.created || "").slice(0, 10))}</span></div>
    <h3 style="margin:6px 0">${md(d.title || "")}</h3>${wrongBody(w)}
    <div class="rate-box" data-k="${qa(key)}">${rateInner(key)}</div>${link}</article>`;
}
function renderWrong(tgt) {
  curSec = null;
  const secs = Array.from(new Set(WRONG.map(w => w.section).filter(Boolean))).sort();
  const q = wrOpt.q.trim().toLowerCase();
  const items = WRONG.filter(w => {
    if (wrOpt.cause !== "all" && w.cause !== wrOpt.cause) return false;
    if (wrOpt.sec !== "all" && w.section !== wrOpt.sec) return false;
    const st = statusOf("w/" + w.id).text;
    if (wrOpt.st === "todo" && st !== "未做" && !/^✗/.test(st)) return false;
    if (wrOpt.st === "done" && st !== "已学会") return false;
    if (wrOpt.st === "week" && weekMark(w.id)) return false;
    if (q && !JSON.stringify(w).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.id - a.id);
  const opt = (v, l, cur) => `<option value="${qa(v)}"${cur === v ? " selected" : ""}>${esc(l)}</option>`;
  $("#main").innerHTML = `<div class="eyebrow">错题区</div><h1>错题区</h1>
    <p class="note" style="max-width:46em">每周末把错题重做一遍：先自己做，再点开错因和正解，在卡片上自评 ✓ ✗ 就记为本周已重做。连续两次（不同天）独立做对才算学会。「师」是老师补充题。</p>
    ${(() => { const wk = WRONG.map(w => weekMark(w.id)), cnt = c => WRONG.filter(w => w.cause === c).length;
      return `<div class="wr-sum"><span class="lab">本周重做</span><b>${wk.filter(Boolean).length} / ${WRONG.length}</b><span class="note">做对 ${wk.filter(r => r === "ok").length}</span><span class="lab" style="margin-left:10px">错因累计</span>${CAUSES.map(c => `<a class="chip${wrOpt.cause === c ? " on" : ""}" href="javascript:void 0" data-cause="${qa(c)}">${esc(c)} ${cnt(c)}</a>`).join("")}</div>`; })()}
    <div class="wr-bar"><select id="wrCause">${opt("all", "全部错因", wrOpt.cause)}${CAUSES.map(c => opt(c, c, wrOpt.cause)).join("")}</select>
      <select id="wrSec">${opt("all", "全部章节", wrOpt.sec)}${secs.map(c => opt(c, c, wrOpt.sec)).join("")}</select>
      <select id="wrSt">${opt("all", "全部状态", wrOpt.st)}${opt("todo", "还没学会", wrOpt.st)}${opt("done", "已学会", wrOpt.st)}${opt("week", "本周未重做", wrOpt.st)}</select>
      <input id="wrQ" type="search" placeholder="搜题干、错解" value="${qa(wrOpt.q)}"><span class="tally">${items.length} / ${WRONG.length} 题</span></div>
    <div id="wrList">${items.map(wrongCard).join("") || `<div class="empty panel"><h2>这里还是空的</h2><p>把做错的题发给我，我会按错因整理后收进来。</p></div>`}</div>`;
  const re = () => renderWrong();
  $("#wrCause").addEventListener("change", e => { wrOpt.cause = e.target.value; re(); });
  $$(".wr-sum [data-cause]").forEach(a => a.addEventListener("click", () => { wrOpt.cause = wrOpt.cause === a.dataset.cause ? "all" : a.dataset.cause; re(); }));
  $("#wrSec").addEventListener("change", e => { wrOpt.sec = e.target.value; re(); });
  $("#wrSt").addEventListener("change", e => { wrOpt.st = e.target.value; re(); });
  let tm; $("#wrQ").addEventListener("input", e => { clearTimeout(tm); tm = setTimeout(() => { wrOpt.q = e.target.value; re(); const q2 = $("#wrQ"); q2.focus(); q2.setSelectionRange(99, 99); }, 250); });
  bindRate($("#main")); typeset($("#main"));
  if (tgt) { const el = $("#w" + tgt); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 60); }
}
let wrFetched = false;
function showWrong(tgt) {
  renderWrong(tgt);
  if (!wrFetched) { wrFetched = true; const before = JSON.stringify(WRONG); loadWrong().then(ok => { if (ok && JSON.stringify(WRONG) !== before && location.hash.startsWith("#wrong")) renderWrong(tgt); }); }
}

/* ===== 12. 路由 ===== */
function route() {
  let h = decodeURIComponent(location.hash.slice(1)), tgt = "";
  const ci = h.indexOf(":");
  if (ci > 0) { tgt = h.slice(ci + 1); h = h.slice(0, ci); }
  $("#toc").classList.remove("open"); $("#tocBtn").setAttribute("aria-expanded", "false");
  stopSampleTimer();
  let m;
  if (KB.sections[h]) { renderToc(h); renderSection(KB.sections[h]); }
  else if ((m = h.match(/^c(\d+)-end$/))) { renderToc(h); renderChapterEnd(+m[1]); }
  else if (h === "wrong") { renderToc(null); showWrong(tgt); updateDot(); window.scrollTo(0, 0); return; }
  else if (h === "review") { renderToc(null); renderHub(); }
  else if (h === "spaced") { renderToc(null); renderSpaced(); }
  else if (h === "weak") { renderToc(null); renderWeak(); }
  else if (h === "quick") { renderToc(null); renderQuick(); }
  else if (h === "sample") { renderToc(null); renderSample(); }
  else if (h === "search") { renderToc(null); renderSearch(tgt); }
  else { renderToc(null); renderHome(); }
  updateDot();
  window.scrollTo(0, 0);
  if (tgt && curSec) setTimeout(() => focusTarget(curSec, tgt), 80);
}

/* ===== 13. 记录面板 ===== */
$("#syncGo").addEventListener("click", () => { sync.token = $("#syncTok").value.trim(); wrFetched = false; syncSaveCfg(); sync.msg = "同步中…"; showSyncMsg(); syncNow(true); });
function openRec() { $("#syncTok").value = sync.token; showSyncMsg(); $("#recOut").value = JSON.stringify({ marks: store.marks, srs: store.srs, stars: store.stars, starT: store.starT, notes: store.notes, noteT: store.noteT, exported: today() }, null, 1); $("#recMsg").textContent = ""; $("#recWrap").hidden = false; }
$("#recBtn").addEventListener("click", openRec);
$("#recClose").addEventListener("click", () => { $("#recWrap").hidden = true; });
$("#recWrap").addEventListener("click", e => { if (e.target.id === "recWrap") $("#recWrap").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#recWrap").hidden = true; });
$("#recCopy").addEventListener("click", () => {
  const ta = $("#recOut");
  const fallback = () => { ta.focus(); ta.select(); $("#recMsg").textContent = "已选中全部文字，按 Ctrl+C 复制"; };
  try { navigator.clipboard.writeText(ta.value).then(() => { $("#recMsg").textContent = "已复制"; }, fallback); } catch (e) { fallback(); }
});
$("#recImport").addEventListener("click", () => {
  try {
    const obj = JSON.parse($("#recIn").value); const mk = obj.marks || {}; let n = 0;
    for (const k in mk) { const seen = new Set((store.marks[k] || []).map(mid)); for (const x of mk[k]) if (x && x.d && SYM[x.r] && !seen.has(mid(x))) { (store.marks[k] = store.marks[k] || []).push(x); n++; } if (store.marks[k]) store.marks[k].sort((a, b) => a.d < b.d ? -1 : 1); }
    const sr = obj.srs || {};
    for (const k in sr) { const a = store.srs[k], b = sr[k]; if (b && b.due && (!a || (b.last || "") > (a.last || ""))) { store.srs[k] = b; n++; } }
    const st = obj.stars || {}; for (const k in st) if (st[k] && !store.stars[k]) { setStar(k, true); n++; }
    { const m = mergeState(syncPayload(), { notes: obj.notes || {}, noteT: obj.noteT || {} }); store.notes = m.notes; store.noteT = m.noteT; }
    save(); $("#recIn").value = ""; openRec(); $("#recMsg").textContent = "导入了 " + n + " 条"; route();
  } catch (e) { $("#recMsg").textContent = "导入失败：粘贴的不是完整的记录文字，请从「当前记录」整段复制"; }
});
$("#tocBtn").addEventListener("click", () => { const t = $("#toc"); t.classList.toggle("open"); $("#tocBtn").setAttribute("aria-expanded", String(t.classList.contains("open"))); });
window.addEventListener("hashchange", route);

/* ===== 14. 并行载入数据文件，全部到齐再显示 ===== */
(function loadAll() {
  let left = DATA_FILES.length;
  const done = () => { if (--left === 0) { applySeeds(); mergeWrong(); route(); if (syncOn()) { syncNow(); loadWrong(); } } };
  DATA_FILES.forEach(f => {
    const el = document.createElement("script");
    el.src = f; el.onload = done;
    el.onerror = () => { console.warn("数据文件没载入：" + f); done(); };
    document.body.appendChild(el);
  });
})();
</script>
